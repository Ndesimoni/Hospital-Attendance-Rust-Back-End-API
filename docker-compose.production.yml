services:

  postgres:
    image: postgres:17
    container_name: task_flow_postgres_prod
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-7-alpine
    container_name: task_flow_redis
    restart: always

    ports:
       - "6379:6379"


#api services
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: task_flow_api_prod
    restart: always

    expose:
      - "4000"

    environment:
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RUST_LOG: ${RUST_LOG}

    depends_on:
      - postgres

  nginx:
    image: nginx:latest
    container_name: task_flow_nginx
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
       - api

volumes:
  postgres_prod_data:
